name: Validate Clawd Pay Kit

on:
  pull_request:
    branches: [main]
    paths:
      - 'integrations/clawd-pay-kit/**'
      - 'integrations/musebook/batch-settlement/**'
      - '.github/workflows/clawd-pay-kit.yml'

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/clawd-pay-kit
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify supplied source snapshot
        run: npm run source:check
      - name: Install locked source dependencies and build Clawd kit
        run: npm run setup
      - name: Check types
        run: npm run typecheck
      - name: Run TypeScript conformance and Clawd policy harness
        run: npm test
