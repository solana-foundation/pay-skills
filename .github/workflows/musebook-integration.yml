name: Validate Musebook integration

on:
  pull_request:
    branches: [main]
    paths:
      - 'integrations/musebook/**'
      - '.github/workflows/musebook-integration.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test channel requirements and owner policy
        run: node --test integrations/musebook/batch-settlement/preflight.test.mjs
